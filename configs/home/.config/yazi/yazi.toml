# Sioyek is single-instance by default: opening another PDF while one is
# running only focuses the existing window. --new-instance spawns a separate
# process per document, so Enter on each PDF gets its own window.
#
# Yazi 26 opener syntax: definitions live in [opener] as a LIST, file
# placeholders are %s1 (first file) / %s (spread), not the deprecated $@.
[open]
rules = [
  { use = "sioyek-new", mime = "application/pdf" },
]

[opener]
  # Use the wrapper directly: apps spawned by niri (Super+Y) inherit a PATH
  # without ~/.local/bin and would find the unwrapped /usr/bin/sioyek, whose
  # native Wayland path fails to present its first frame under Qt 6.11 + niri.
sioyek-new = [
  { run = '~/.local/bin/sioyek --new-instance %s1', desc = "Open with Sioyek (new window)", orphan = true },
]

# Only build the playlist from video files in the played file's own directory.
#
# BDRip releases ship a sibling `.mka` (extracted FLAC audio) next to every
# `.mkv`. With the default `audio=yes`, autoload inserted those `.mka` entries
# between episodes (identical name prefix sorts right before `.mkv`), doubling
# the playlist and breaking "next episode". `images=no` keeps cover/thumbnail
# JPEGs in the same directories out of the playlist as well.
#
# `ignore` keeps subdirectories (CDs/, Scans/, SPs/) out of the playlist too,
# so PgUp/PgDn only ever walks episodes.

videos=yes
audio=no
images=no

# One level, files only: no recursive scan, no directory entries.
directory_mode=ignore

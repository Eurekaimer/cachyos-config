h script-binding memo-history                                                               #! 文件 > 播放历史
# script-binding uosc/playlist                                                              #! 文件 > 播放列表
ALT+c script-binding uosc/chapters                                                          #! 文件 > 章节
b script-binding uosc/open-file                                                             #! 文件 > 打开文件
# script-binding uosc/show-in-directory                                                     #! 文件 > 在文件管理器中打开

# apply-profile Deband-Medium                                                               #! 视频 > 滤镜 > 去色带 (中等)
# apply-profile Deband-Strong                                                               #! 视频 > 滤镜 > 去色带 (强力)

c change-list glsl-shaders clr all                                                          #! 视频 > 着色器 > 清除全部
g cycle interpolation                                                                       #! 视频 > 插帧
# script-binding uosc/video                                                                 #! 视频 > 选择视频轨道

F1 af toggle "lavfi=[loudnorm=I=-14:TP=-3:LRA=4]" ; show-text "${af}"                       #! 音频 > 对话增强
F2 af toggle "lavfi=[dynaudnorm=g=3:f=250:r=0.9:p=0.9:m=10]" ; show-text "${af}"             #! 音频 > 动态音量均衡
# af clr ""                                                                                 #! 音频 > 清除滤镜
# script-binding afilter/toggle-eqr                                                         #! 音频 > 均衡器开关
a cycle audio-normalize-downmix                                                             #! 音频 > 响度均衡开关
# script-binding afilter/toggle-dnm                                                         #! 音频 > 音量均衡器开关
# script-binding afilter/toggle-drc                                                         #! 音频 > 压缩器开关
# script-binding uosc/audio                                                                 #! 音频 > 选择音频轨道

y script-binding uosc/load-subtitles                                                        #! 字幕 > 加载字幕
Y script-binding uosc/subtitles                                                             #! 字幕 > 选择字幕
ALT+j add sub-scale +0.05                                                                   #! 字幕 > 字体调大
ALT+k add sub-scale -0.05                                                                   #! 字幕 > 字体调小
z add sub-delay -0.1                                                                        #! 字幕 > 字幕提前
Z add sub-delay  0.1                                                                        #! 字幕 > 字幕延后


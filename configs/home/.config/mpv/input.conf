MBTN_LEFT cycle pause;script-message-to uosc flash-pause-indicator #@click
TAB script-message-to uosc toggle-ui #@press
TAB script-message-to uosc toggle-ui #@release
MBTN_RIGHT script-binding evafast/speedup #@press
MBTN_RIGHT script-binding evafast/slowdown #@release

d cycle deband
ctrl+d script-binding autodeint/autodeint
MOUSE_BTN2 script-binding uosc/menu-blurred
ENTER cycle fullscreen
SPACE cycle pause;script-message-to uosc flash-pause-indicator
q quit
Q quit-watch-later
s screenshot
S screenshot video
Ctrl+s screenshot window
o show-progress
O cycle-values osd-level 1 3
RIGHT seek 5
LEFT seek -5
UP seek 60
DOWN seek -60
Shift+RIGHT seek 30 exact
Shift+LEFT seek -30 exact
Shift+UP add volume 5
Shift+DOWN add volume -5
WHEEL_UP add volume 2
WHEEL_DOWN add volume -2
PGUP playlist-next
PGDWN playlist-prev
Ctrl+o script-binding uosc/open-file
Ctrl+p script-binding uosc/items
ALT+a script-message-to uosc show-submenu-blurred "File"
ALT+z script-message-to uosc show-submenu-blurred "Audio"
ALT+x script-message-to uosc show-submenu-blurred "Subtitles"
ALT+s script-message-to uosc show-submenu-blurred "Video > Shaders"


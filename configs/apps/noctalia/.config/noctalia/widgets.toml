[bar.main]
position = "top"
# Compact bar with normally proportioned sans-serif text.
thickness = 44
radius = 0
enabled = true
# Overlay auto-hide bar: no reserved exclusive zone, revealed from the top edge.
auto_hide = true
smart_auto_hide = false
show_on_workspace_switch = true
reserve_space = false
background_opacity = 0.0
shadow = false
compositor_blur = false
border_width = 0.0
# Flush to the screen; the Powerline joins need zero gap between groups.
margin_ends = 0
margin_edge = 0
padding = 0
widget_spacing = 0
# Larger icons without larger text: 14px × 1.2 × 1.0 ≈ 16.8px.
scale = 1.2
font_scale = 1.0
font_family = "Noto Sans"
font_weight = 400
color = "on_surface_variant"
icon_color = "primary"
capsule_foreground = "on_surface_variant"
capsule = false
capsule_thickness = 1.0
capsule_padding = 6
capsule_opacity = 1.0
start = ["group:time-band", "time-join", "group:left-band", "left-tip"]
center = ["group:center-band"]
end = ["right-tip", "group:right-band", "controls-join", "group:controls-band"]

[[bar.main.capsule_group]]
id = "time-band"
members = ["launcher", "clock"]
fill = "primary_container"
foreground = "on_primary_container"
radius = 0.0
padding = 8.0
widget_spacing = 6

[[bar.main.capsule_group]]
id = "left-band"
members = ["cpu-usage", "cpu-temperature", "memory-usage", "disk-free"]
fill = "surface_container_high"
foreground = "on_surface"
radius = 0.0
padding = 6.0
widget_spacing = 6
opacity = 1.0

[[bar.main.capsule_group]]
id = "center-band"
members = ["workspaces", "audio-visualizer"]
fill = "secondary_container"
foreground = "on_secondary_container"
radius = 22.0
padding = 12.0
widget_spacing = 6
opacity = 1.0

[[bar.main.capsule_group]]
id = "right-band"
members = ["taskbar", "tray", "notifications", "battery", "volume", "bluetooth", "brightness"]
fill = "surface_container_high"
foreground = "on_surface"
radius = 0.0
padding = 6.0
widget_spacing = 6
opacity = 1.0

[[bar.main.capsule_group]]
id = "controls-band"
members = ["control-center", "wallpaper"]
fill = "tertiary_container"
foreground = "on_tertiary_container"
radius = 0.0
padding = 8.0
widget_spacing = 6

[widget.left-tip]
type = "custom_button"
glyph = ""
label = ""
font_family = "Monaspace Neon"
font_scale = 2.2
color = "surface_container_high"
interactive = false

[widget.right-tip]
type = "custom_button"
glyph = ""
label = ""
font_family = "Monaspace Neon"
font_scale = 2.2
color = "surface_container_high"
interactive = false

[widget.time-join]
type = "custom_button"
glyph = ""
label = ""
font_family = "Monaspace Neon"
font_scale = 2.2
color = "primary_container"
capsule = true
capsule_fill = "surface_container_high"
capsule_radius = 0.0
capsule_padding = 0
interactive = false

[widget.controls-join]
type = "custom_button"
glyph = ""
label = ""
font_family = "Monaspace Neon"
font_scale = 2.2
color = "tertiary_container"
capsule = true
capsule_fill = "surface_container_high"
capsule_radius = 0.0
capsule_padding = 0
interactive = false

[bar.main.dead_zone.actions]
right = "panel-toggle control-center home"
middle = "none"
scroll_up = "none"
scroll_down = "none"

[widget.launcher]
type = "launcher"
custom_image = "/usr/share/icons/cachyos.svg"
custom_image_colorize = false

[widget.clock]
type = "clock"
format = "%H:%M · %m/%d"
vertical_format = "%H %M - %d %m"
tooltip_format = "%H:%M %a, %b %d"

[widget.cpu-usage]
type = "sysmon"
stat = "cpu_usage"
visualization = "none"
show_value = true
show_glyph = true
label_show_units = true
font_family = "Noto Sans"
capsule = false

[widget.cpu-temperature]
type = "sysmon"
stat = "cpu_temp"
visualization = "none"
show_value = true
show_glyph = true
label_show_units = true
font_family = "Noto Sans"
capsule = false

[widget.memory-usage]
type = "local/storage_gb:memory"
font_family = "Noto Sans"
capsule = false

# Decimal GB available on the bar; full capacity and usage details on hover.
[widget.disk-free]
type = "local/storage_gb:available"
font_family = "Noto Sans"
capsule = false

[widget.workspaces]
type = "workspaces"
hide_when_empty = false
show_labels = true
label_source = "id"
labels_only_when_occupied = true
max_label_chars = 2
show_icons = false
style = "focus_hint"
font_family = "Noto Sans"
font_scale = 1.0
focused_output_only = false
focused_color = "primary"
occupied_color = "secondary"
empty_color = "secondary"
font_weight = 500

[widget.audio-visualizer]
type = "audio_visualizer"
width = 96
show_when_idle = false
color_1 = "primary"
color_2 = "primary"

[widget.tray]
type = "tray"
hidden = []
pinned = []
hide_passive = false
drawer = false

[widget.notifications]
type = "notifications"
hide_when_no_unread = false

[widget.battery]
type = "battery"
device = "auto"
display_mode = "graphic"
show_label = false
hide_when_plugged = false
hide_when_full = false

[widget.volume]
type = "volume"
device = "output"
show_label = false

[widget.volume.actions]
middle = "exec pwvucontrol || pavucontrol"

[widget.bluetooth]
type = "bluetooth"
show_label = false
hide_when_adapter_off = false
hide_when_no_connected_device = false

[widget.brightness]
type = "brightness"
show_label = false

[widget.control-center]
type = "control-center"
glyph = "noctalia"

[widget.wallpaper]
type = "wallpaper"

[dock]
enabled = false
position = "bottom"
background_opacity = 1.0
auto_hide = true
smart_auto_hide = false
reserve_space = false
show_running = true
show_dots = false
show_instance_count = false
inactive_opacity = 0.6
magnification = false
launcher_position = "none"
pinned = []

[control_center]
shortcuts = [
  { type = "wifi" },
  { type = "bluetooth" },
  { type = "wallpaper" },
  { type = "notification" },
  { type = "power_profile" },
  { type = "caffeine" },
  { type = "nightlight" },
]

# Running applications stay visible in the top bar; the bottom Dock remains disabled.
[widget.taskbar]
type = "taskbar"
group_by_workspace = false
show_all_outputs = true
only_active_workspace = false
show_window_title = false
icon_scale = 1.1
item_spacing = 5
taskbar_max_width = 360
show_active_indicator = true
active_indicator_color = "primary"
inactive_opacity = 0.85

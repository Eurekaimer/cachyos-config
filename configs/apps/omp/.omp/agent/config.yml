modelRoles:
  smol: openai-codex/gpt-6.1-sol:high
  default: commandcode/deepseek/deepseek-v4.1-flash-fast:max
symbolPreset: nerd
theme:
  dark: shorin
  light: pearl
setupVersion: 2
dev:
  autoqaConsent: granted
display:
  showTokenUsage: true
  shimmer: disabled
  pinnedAgents: full
  subagentLivePreview: true
defaultThinkingLevel: auto
composer:
  shape: claude
  tokenRate: true
codexResets:
  autoRedeem: "no"
tui:
  codexResetFireworks: true
  resizeScrollback: rebuild
  textSizing: true
  mouse: false
  tight: false
task:
  agentModelOverrides:
    reviewer: commandcode/deepseek/deepseek-v4.1-flash
    scout: commandcode/deepseek/deepseek-v4.1-flash
    sonic: commandcode/deepseek/deepseek-v4.1-flash
    security-reviewer: commandcode/deepseek/deepseek-v4.1-flash-fast
    task: commandcode/deepseek/deepseek-v4.1-flash-fast
colorBlindMode: false
statusLine:
  preset: custom
  separator: none
  leftSegments:
    - pi
    - mode
    - context_pct
    - token_in
    - token_out
    - token_rate
    - time_spent
    - time
    - cost
  rightSegments:
    - usage
    - path
    - git
    - model
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 20
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: false
      showUnstaged: true
      showUntracked: false
    time:
      format: 24h
      showSeconds: false
  compactThinkingLevel: false
  transparent: true
  contextLine: "off"
terminal:
  showProgress: false
images:
  blockImages: true
readLineNumbers: true
read:
  renderMarkdown: true
  toolResultPreview: true
plan:
  defaultOnStartup: true
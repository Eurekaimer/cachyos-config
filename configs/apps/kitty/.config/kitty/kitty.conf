include themes/shorin.conf

# Compact FantasqueSans for Latin; LXGW WenKai remains the Chinese fallback.
font_family FantasqueSansM Nerd Font Mono
font_size 22.0
modify_font cell_width 92%
modify_font cell_height 95%
symbol_map U+2E80-U+2FFF LXGW WenKai Mono
symbol_map U+3000-U+303F LXGW WenKai Mono
symbol_map U+31C0-U+31EF LXGW WenKai Mono
symbol_map U+3400-U+4DBF LXGW WenKai Mono
symbol_map U+4E00-U+9FFF LXGW WenKai Mono
symbol_map U+F900-U+FAFF LXGW WenKai Mono
symbol_map U+FF00-U+FFEF LXGW WenKai Mono

# Desktop integration
linux_display_server auto
hide_window_decorations yes
window_padding_width 6
remember_window_size no
confirm_os_window_close 0

# Keep the wallpaper visible; no opaque terminal color block.
background_opacity 0.35
dynamic_background_opacity yes

# Bell and clipboard
enable_audio_bell no
copy_on_select no
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

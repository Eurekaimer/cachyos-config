# Only deviations from the shipped keymap-default.toml live here; every other
# key comes from the preset. See
# https://yazi-rs.github.io/docs/configuration/overview#mixing

# Yank inside Yazi and put the same files on the Wayland clipboard as
# text/uri-list, so GUI apps paste them as files.
[[mgr.prepend_keymap]]
on   = "y"
run  = [ 'shell -- for path in %s; do echo "file://$path"; done | wl-copy -t text/uri-list', "yank" ]
desc = "Yank and copy files to the system clipboard"

# Only deviations from the shipped yazi-default.toml live here; every other
# option comes from the preset. See
# https://yazi-rs.github.io/docs/configuration/overview#mixing

[mgr]
ratio    = [ 2, 3, 3 ]
sort_by  = "natural"
linemode = "size"

[preview]
wrap = "yes"

[input]
cd_offset     = [ 0, 2, 80, 3 ]
create_offset = [ 0, 2, 80, 3 ]
rename_offset = [ 0, 1, 80, 3 ]
filter_offset = [ 0, 2, 80, 3 ]
find_offset   = [ 0, 2, 80, 3 ]
search_offset = [ 0, 2, 80, 3 ]
shell_offset  = [ 0, 2, 80, 3 ]

[opener]
# Yazi 26 syntax: one list per opener; %s1 is the first file, %s all files.
default-browser = [
	{ run = 'gio open %s', desc = "Open in default browser", orphan = true },
]
# Each PDF gets its own window; --new-window also works when no instance is
# running. lektra lives in /usr/bin, which is on PATH for Yazi from a terminal
# and for the Super+Y wrapper.
lektra-pdf = [
	{ run = 'lektra --new-window %s1', desc = "Open PDF in Lektra (new window)", orphan = true },
]
# Markdown and plain text always beat the content-sniffed MIME: `file` reports a
# README full of <img>/<table> as text/html, and Yazi trusts that, so the .md
# extension has to win in [open] before any HTML rule.
markdown-open = [
	{ run = 'gtk-launch neovim-markdown %s', desc = "Open Markdown in Neovim (new window)", orphan = true },
]
neovim-open = [
	{ run = 'kitty --title Neovim nvim -- %s', desc = "Open in Neovim (new window)", orphan = true },
]

[open]
prepend_rules = [
	# Structured config/docs go to Neovim by extension. This also has to beat the
	# MIME rules, since libmagic sniffs TOML/JSON that mention markup in comments
	# or values as text/html (system browser), and plain JSON as application/json
	# (the default `edit` opener).
	{ use = "neovim-open", url = "*.{toml,json,jsonc,json5,jsonl,ndjson}" },
	{ use = "markdown-open", url = "*.{md,markdown,mdown,mkd}" },
	{ use = "markdown-open", mime = "text/{markdown,x-markdown}" },
	{ use = "neovim-open", url = "*.gitignore" },
	{ use = "markdown-open", mime = "text/plain" },
	{ use = "default-browser", mime = "text/html" },
	{ use = "default-browser", mime = "application/xhtml+xml" },
	{ use = "default-browser", url = "*.{html,htm,HTML,HTM,xhtml}" },
	{ use = "lektra-pdf", mime = "application/pdf" },
]

[plugin]
# dirsize.yazi publishes recursive directory sizes into the file list.
append_fetchers = [
	{ url = "*/", run = "dirsize", prio = "low", group = "size" },
]

# Only deviations from the shipped yazi-default.toml live here; every other
# option comes from the preset. See
# https://yazi-rs.github.io/docs/configuration/overview#mixing

[mgr]
ratio    = [ 2, 3, 3 ]
sort_by  = "natural"
linemode = "size"

[preview]
wrap = "yes"

[input]
cd_offset     = [ 0, 2, 80, 3 ]
create_offset = [ 0, 2, 80, 3 ]
rename_offset = [ 0, 1, 80, 3 ]
filter_offset = [ 0, 2, 80, 3 ]
find_offset   = [ 0, 2, 80, 3 ]
search_offset = [ 0, 2, 80, 3 ]
shell_offset  = [ 0, 2, 80, 3 ]

[opener]
# Yazi 26 syntax: one list per opener; %s1 is the first file, %s all files.
chrome-open = [
	{ run = '/usr/bin/google-chrome-stable %s', desc = "Open HTML in Google Chrome", orphan = true },
]
# --new-instance gives each PDF its own window. Use the wrapper directly:
# apps spawned by niri (Super+Y) have no ~/.local/bin in PATH, and the system
# sioyek fails to present its first frame under Qt 6.11 + niri.
sioyek-new = [
	{ run = '~/.local/bin/sioyek --new-instance %s1', desc = "Open with Sioyek (new window)", orphan = true },
]
# Use the Markdown launcher even when a .md file is detected as text/plain.
markdown-open = [
	{ run = 'gtk-launch neovim-markdown %s', desc = "Open Markdown in Neovim (new window)", orphan = true },
]
neovim-open = [
	{ run = 'kitty --title Neovim nvim -- %s', desc = "Open in Neovim (new window)", orphan = true },
]

[open]
prepend_rules = [
	{ use = "chrome-open", mime = "text/html" },
	{ use = "chrome-open", mime = "application/xhtml+xml" },
	{ use = "chrome-open", url = "*.{html,htm,HTML,HTM,xhtml}" },
	{ use = "neovim-open", url = "*.gitignore" },
	{ use = "sioyek-new", mime = "application/pdf" },
	{ use = "markdown-open", mime = "text/{markdown,x-markdown}" },
	{ use = "markdown-open", url = "*.{md,markdown,mdown,mkd}" },
]

[plugin]
# dirsize.yazi publishes recursive directory sizes into the file list.
append_fetchers = [
	{ url = "*/", run = "dirsize", prio = "low", group = "size" },
]

<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
  <!-- 中文优先使用 LXGW WenKai -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>LXGW WenKai</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test qual="any" name="family">
      <string>sans</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>LXGW WenKai</string>
    </edit>
  </match>

  <!-- 全局默认字体加 LXGW -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>LXGW WenKai</family>
    </prefer>
  </alias>

  <!-- Galgame: 日文/中文字体名统一映射到 LXGW WenKai Mono（等宽，ASCII 0.5em / CJK 1.0em） -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>ＭＳ ゴシック</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>LXGW WenKai Mono</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq">
      <string>MS Gothic</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>LXGW WenKai Mono</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq">
      <string>ＭＳ Ｐゴシック</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>LXGW WenKai Mono</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq">
      <string>MS PGothic</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>LXGW WenKai Mono</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq">
      <string>MS UI Gothic</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>LXGW WenKai Mono</string>
    </edit>
  </match>

  <match target="pattern">

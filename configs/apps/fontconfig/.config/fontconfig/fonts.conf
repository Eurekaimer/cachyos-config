    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>LXGW WenKai Mono</string>
    </edit>
  </match>

  <!-- Galgame: 拉丁等宽场景用 Monaspace Xenon -->
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Monaspace Xenon</family>
      <family>LXGW WenKai Mono</family>
    </prefer>
  </alias>

  <!-- ===== Global: proportional/CJK -> LXGW WenKai, monospace -> Monaspace Xenon ===== -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>LXGW WenKai</family>
    </prefer>
  </alias>
  <alias>
    <family>sans</family>
    <prefer>
      <family>LXGW WenKai</family>
    </prefer>
  </alias>

